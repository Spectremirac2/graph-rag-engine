name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          # Pinned, not floating. The stable channel moves, and clippy gains lints with
          # it, so a green build turns red on a Rust release with nothing here having
          # changed — which is what happened to ferrite and zkvm. Same reasoning as
          # the SHA-pinned actions and the pinned model checkpoints: a moving
          # reference is not a reference.
          toolchain: "1.93"
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
